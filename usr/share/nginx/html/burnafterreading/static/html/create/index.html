<html>
    <head>
        <meta charset="utf-8">
        <!--# include file="meta.html" -->
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

        <script src="/static/js/main.js"></script>
        <link rel="stylesheet" type="text/css" href="/static/css/main.css">
    </head>
    <body>
        <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
          <defs>
            <filter id="sketch" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
              <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="5" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
          </defs>
        </svg>

        <div class="card">
            <div class="brand">
                <div class="brand-name">
                    <a class="brand-logo-link" rel="noreferrer nofollow noopener" href="https://<!--# echo var="host" -->/">
                        <svg class="icon" width="28" height="28" aria-hidden="true"><use href="/static/img/sprite.svg#i-flame"></use></svg>
                    </a>
                    <span>Burn After Reading</span>
                </div>
                <div class="brand-actions">
                    <a class="badge" href="/about">About</a>
                </div>
            </div>
            <div class="card-body">
                <!--# include file="body.html" -->
            </div>
        </div>
    </body>
</html>
